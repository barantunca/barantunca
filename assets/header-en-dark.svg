<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img" aria-labelledby="title desc">
  <title id="title">Baran Tunca</title>
  <desc id="desc">building software with AI agents / I make the calls, agents do the repetitive work / sweating the small details of the interface. Software Engineering · Fırat University · İzmir</desc>
  <style>
    .name{font:700 42px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:#e6edf3;letter-spacing:-0.5px}
    .sub{font:400 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:#9198a1}
    .typed{font:400 20px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;fill:#e6edf3}
    .prompt{font:700 20px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;fill:#58a6ff}
    .cover{fill:#161b22;transform-box:fill-box;transform-origin:right center}
    .cursor{fill:#58a6ff;opacity:0}
    .blink{animation:blink 1s steps(1,end) infinite}
    @keyframes blink{0%{opacity:1}50%{opacity:0}}
.l0{opacity:0;animation:l0 15956ms infinite;animation-delay:-15956ms}
@keyframes l0{
0%{opacity:1;animation-timing-function:step-end}
26.554%{opacity:0}
100%{opacity:0}}
