@keyframes c1{
0%{transform:scaleX(1);animation-timing-function:steps(47,end)}
16.201%{transform:scaleX(0)}
28.109%{transform:scaleX(0);animation-timing-function:steps(47,end)}
33.411%{transform:scaleX(1)}
100%{transform:scaleX(1)}}
.k1{animation:k1 15956ms infinite;animation-delay:-11270ms}
@keyframes k1{
0%{opacity:1;transform:translateX(0);animation-timing-function:steps(47,end)}
16.201%{opacity:1;transform:translateX(564px)}
28.109%{opacity:1;transform:translateX(564px);animation-timing-function:steps(47,end)}
33.411%{opacity:1;transform:translateX(0)}
33.417%{opacity:0;transform:translateX(0)}
100%{opacity:0;transform:translateX(0)}}
.l2{opacity:0;animation:l2 15956ms infinite;animation-delay:-5489ms}
