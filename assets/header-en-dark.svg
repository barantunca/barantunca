0%{transform:scaleX(1);animation-timing-function:steps(32,end)}
11.030%{transform:scaleX(0)}
22.938%{transform:scaleX(0);animation-timing-function:steps(32,end)}
26.548%{transform:scaleX(1)}
100%{transform:scaleX(1)}}
.k0{animation:k0 15956ms infinite;animation-delay:-15956ms}
@keyframes k0{
0%{opacity:1;transform:translateX(0);animation-timing-function:steps(32,end)}
11.030%{opacity:1;transform:translateX(384px)}
22.938%{opacity:1;transform:translateX(384px);animation-timing-function:steps(32,end)}
26.548%{opacity:1;transform:translateX(0)}
26.554%{opacity:0;transform:translateX(0)}
100%{opacity:0;transform:translateX(0)}}
.l1{opacity:0;animation:l1 15956ms infinite;animation-delay:-11270ms}
@keyframes l1{
0%{opacity:1;animation-timing-function:step-end}
33.417%{opacity:0}
100%{opacity:0}}
